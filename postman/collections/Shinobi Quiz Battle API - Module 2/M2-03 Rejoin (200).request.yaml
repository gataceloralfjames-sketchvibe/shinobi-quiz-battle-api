$kind: http-request
url: "{{baseUrl}}/sessions/{{code}}/players"
method: POST
headers:
  X-Demo-User: "{{player}}"
  Content-Type: application/json
body:
  type: json
  content: '{"nickname": "Hinata"}'
scripts:
  - type: afterResponse
    code: |-
      pm.test("rejoin answers 200", function () {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json().rejoined).to.eql(true);
        pm.expect(String(pm.response.json().id)).to.eql(String(pm.collectionVariables.get("playerId")));
      });
    language: text/javascript
order: 4000
