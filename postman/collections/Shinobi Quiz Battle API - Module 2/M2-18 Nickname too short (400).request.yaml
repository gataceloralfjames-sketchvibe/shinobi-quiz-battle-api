$kind: http-request
url: "{{baseUrl}}/sessions/{{code}}/players"
method: POST
headers:
  X-Demo-User: "{{player2}}"
  Content-Type: application/json
body:
  type: json
  content: '{ "nickname": "a" }'
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 400", function () {
        pm.response.to.have.status(400);
      });

      pm.test("Code is VALIDATION_FAILED", function () {
        pm.expect(pm.response.json().error.code).to.eql("VALIDATION_FAILED");
      });
    language: text/javascript
order: 4451
