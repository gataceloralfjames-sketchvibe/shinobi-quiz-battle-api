$kind: http-request
url: "{{baseUrl}}/sessions/{{code}}/players"
method: GET
headers:
  X-Demo-User: "{{host}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("list answers 200", function () {
        pm.response.to.have.status(200);
      });
      pm.test("no private fields", function () {
        const text = JSON.stringify(pm.response.json());
        ["school_id", "email", "full_name", "user_id", "userId"].forEach(function (f) {
          pm.expect(text).to.not.include(f);
        });
      });
    language: text/javascript
order: 5000
