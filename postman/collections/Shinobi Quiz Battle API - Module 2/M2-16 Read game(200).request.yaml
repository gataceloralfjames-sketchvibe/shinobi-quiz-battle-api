$kind: http-request
url: "{{baseUrl}}/sessions/{{code}}"
method: GET
headers:
  X-Demo-User: "{{host}}"
  Content-Type: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () {
        pm.response.to.have.status(200);
      });

      pm.test("Returns the game with its join code", function () {
        const body = pm.response.json();
        pm.expect(body.joinCode).to.eql(pm.collectionVariables.get("code"));
      });
    language: text/javascript
order: 2842
