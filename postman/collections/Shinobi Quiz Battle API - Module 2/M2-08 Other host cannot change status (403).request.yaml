$kind: http-request
url: "{{baseUrl}}/sessions/{{code}}"
method: PATCH
headers:
  X-Demo-User: "{{otherHost}}"
  Content-Type: application/json
body:
  type: json
  content: '{"status": "finished"}'
scripts:
  - type: afterResponse
    code: |-
      pm.test("other host is refused", function () {
        pm.response.to.have.status(403);
      });
    language: text/javascript
order: 9000
