$kind: http-request
url: "{{baseUrl}}/sessions/AAAAAA"
method: GET
headers:
  X-Demo-User: "{{host}}"
  Content-Type: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 404", function () {
        pm.response.to.have.status(404);
      });

      pm.test("Code is SESSION_NOT_FOUND", function () {
        pm.expect(pm.response.json().error.code).to.eql("SESSION_NOT_FOUND");
      });
    language: text/javascript
order: 2985
