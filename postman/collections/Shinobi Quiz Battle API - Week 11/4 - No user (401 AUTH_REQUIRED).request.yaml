$kind: http-request
url: " {{baseUrl}}/question-sets"
method: GET
headers:
  - key: X-Demo-User
    value: "{{host}}"
    disabled: true
scripts:
  - type: afterResponse
    code: " pm.test(\"status is 401\", function () {\r

      \  pm.response.to.have.status(401);\r

      });\r

      pm.test(\"code is AUTH_REQUIRED\", function () {\r

      \  pm.expect(pm.response.json().error.code).to.eql(\"AUTH_REQUIRED\");\r

      });"
    language: text/javascript
order: 4000
